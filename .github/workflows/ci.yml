name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  build-preview:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --bin parenox --target "$TARGET"
      - name: Test and package binary
        shell: bash
        run: |
          mkdir -p package dist
          cp "target/$TARGET/release/parenox" LICENSE-MIT LICENSE-APACHE package/
          package/parenox --version
          package/parenox check examples/good.clj
          tar -czf "dist/parenox-$TARGET.tar.gz" -C package parenox LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v4
        with:
          name: parenox-${{ matrix.target }}
          path: dist/parenox-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'push'
    needs: [check, build-preview]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: main-preview
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parenox-*
          path: dist
          merge-multiple: true
      - name: Publish main preview
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "Main has moved since this build started."
            exit 0
          fi

          tag=main-preview
          archives=(parenox-aarch64-apple-darwin.tar.gz parenox-x86_64-unknown-linux-gnu.tar.gz)
          sha256sum "${archives[@]}" > SHA256SUMS
          printf 'Build of `%s` from `main`. Verify the archives with `SHA256SUMS`.\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/preview-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${archives[@]}" SHA256SUMS --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true --silent
            gh release edit "$tag" --draft=false --prerelease --latest=false \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          else
            gh release create "$tag" "${archives[@]}" SHA256SUMS --target "$GITHUB_SHA" \
              --title 'Main preview' --prerelease --latest=false \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          fi
