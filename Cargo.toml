[package]
name = "parenox"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/octofhir/parenox"
readme = "README.md"
description = "Fast, source-only Clojure analysis in Rust"

[dependencies]
annotate-snippets = "=0.12.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "parenox"
path = "src/main.rs"
