[package]
name = "parenox"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/octofhir/parenox"
readme = "README.md"
description = "Fast, source-only Clojure analysis in Rust"

[workspace]
members = [
    "crates/parenox-analysis",
    "crates/parenox-formatter",
    "crates/parenox-frontend",
    "crates/parenox-lsp",
]
resolver = "3"

[dependencies]
annotate-snippets = "=0.12.18"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
parenox-analysis = { path = "crates/parenox-analysis" }
parenox-formatter = { path = "crates/parenox-formatter" }
parenox-lsp = { path = "crates/parenox-lsp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "parenox"
path = "src/main.rs"
