[package]
name = "parenox"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/octofhir/parenox"
readme = "README.md"
description = "Fast, source-only Clojure analysis in Rust"

[workspace]
members = [
    "crates/parenox-analysis",
    "crates/parenox-classpath",
    "crates/parenox-formatter",
    "crates/parenox-frontend",
    "crates/parenox-lsp",
    "crates/parenox-runtime",
    "crates/parenox-types",
]
resolver = "3"

[dependencies]
annotate-snippets = "=0.12.18"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
parenox-analysis = { path = "crates/parenox-analysis" }
parenox-classpath = { path = "crates/parenox-classpath" }
parenox-formatter = { path = "crates/parenox-formatter" }
parenox-lsp = { path = "crates/parenox-lsp" }
parenox-runtime = { path = "crates/parenox-runtime" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "parenox"
path = "src/main.rs"

[dev-dependencies]
zip = { version = "=8.6.0", default-features = false }
