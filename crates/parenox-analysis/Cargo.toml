[package]
name = "parenox-analysis"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Static Clojure contracts, type checking, and project sessions for Parenox"

[dependencies]
parenox-frontend = { path = "../parenox-frontend", features = ["serde"] }
parenox-types = { path = "../parenox-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
