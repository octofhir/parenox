[package]
name = "parenox-frontend"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Lossless Clojure syntax and EDN reader for Parenox"

[features]
serde = ["dep:serde"]

[dependencies]
rowan = "=0.18.0-alpha.2"
serde = { version = "1", features = ["derive"], optional = true }
